  - setu
  - plum
  - ramp
  - notion

# Workday tokens need the tenant's "career site" name appended after '#' —
# it's a per-company name picked when they set up Workday, not derivable
# from the subdomain (confirmed empirically: ~half the old bare-subdomain
# entries here 404'd). Verified live on 2026-10-15 by checking each
# company's real indexed myworkdayjobs.com URL. Don't add an entry without
# the '#site_name' suffix verified the same way — WorkdaySource now refuses
# to guess it and returns [] with a warning instead of silently 404ing.
workday:
  - nvidia:https://nvidia.wd5.myworkdayjobs.com#NVIDIAExternalCareerSite
  - salesforce:https://salesforce.wd12.myworkdayjobs.com#External_Career_Site
  - adobe:https://adobe.wd5.myworkdayjobs.com#external_experienced
  - cisco:https://cisco.wd5.myworkdayjobs.com#Cisco_Careers
  - intel:https://intel.wd1.myworkdayjobs.com#External
  - dell:https://dell.wd1.myworkdayjobs.com#External
  - hp:https://hp.wd5.myworkdayjobs.com#ExternalCareerSite
  - broadcom:https://broadcom.wd1.myworkdayjobs.com#External_Career
  # Dropped, verified dead/wrong as of 2026-10-15:
  # - vmware: acquired by Broadcom, no longer has its own Workday tenant (see broadcom above)
  # - amd: migrated off Workday entirely, now at careers.amd.com (custom site, needs a dedicated scraper)
  # - deloitte: one Workday tenant per country (e.g. deloitteie.wd3 for Ireland), not representable as a single token
  # - microsoft, netflix: custom-built careers sites, not the standard myworkdayjobs.com CXS API this source expects
  # Removed unverified, never re-add without checking the real URL first (same mistake as above):
  # - kpmg, accenture, elastic, okta

