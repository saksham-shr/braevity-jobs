# Every entry below was live-verified against https://api.lever.co/v0/postings/{org}
# on 2026-10-15. The previous list (zepto, swiggy, postman, figma, unacademy,
# coinswitch, chargebee, curefit, urbancompany, coindcx, netflix, nerdwallet,
# lucidmotors) was checked and every single one 404s — none of those
# companies are on Lever anymore (or never used that exact org slug). Org
# tokens are case-sensitive; verify with a live curl before adding, not a guess.
lever:
  - jobgether
  - gohighlevel
  - Sprinto
  - paytm
  - proof

