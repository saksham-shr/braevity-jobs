[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "braevity"
version = "0.1.0"
description = "CLI job monitor for ATS platforms"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "aiohttp>=3.9",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "textual>=0.40",
]

[project.scripts]
braevity = "braevity.cli.commands:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
